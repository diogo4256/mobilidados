[project]
name = "streetfit"
version = "0.2.0"
description = "Reproducible, evidence-graded audits of whether a street fits the buses scheduled on it, from open municipal GIS, GTFS and design references."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "Diogo Adegas", email = "diogo.adegas@gmail.com" }]
keywords = ["civic-tech", "gtfs", "gis", "urban-planning", "public-transport", "open-data", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
# Lower bounds: the `lowest` CI job installs exactly these versions and runs the unit tests; the `data` tests
# (cached sources, not in CI) are run locally on the same install.
dependencies = [
  "matplotlib>=3.10.7", # older releases call pyparsing APIs that pyparsing now deprecates (warnings are errors in the tests)
  "numpy>=2.0",
  "pandas>=2.2.2",
  "pydantic>=2.7",
  "pyproj>=3.6",
  "requests>=2.32.2",
  "shapely>=2.1", # 2.0.x (older GEOS) warns "invalid value encountered in distance" on valid geometries
  "urllib3>=2.0",
]

[project.optional-dependencies]
# AI-assisted tools: claim checking, OCR/vision extraction of standards, source discovery
agents = ["anthropic>=2.3", "pypdf>=5.0", "pypdfium2>=4.30"]

[project.scripts]
streetfit = "streetfit.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.6", "types-requests>=2.32"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetfit"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "PT", "RUF"]
ignore = [
  "E501",   # line length is handled by `ruff format`
  "RUF001", # Portuguese text and typographic characters (–, «») are intended
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "data: needs the case's cached sources (streetfit fetch)",
  "live: calls a paid or external API",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pandas is used untyped on purpose: its stubs turn every .loc into a union of scalars and need casts everywhere
module = ["pandas.*", "shapely.*", "pypdfium2.*"]
ignore_missing_imports = true
