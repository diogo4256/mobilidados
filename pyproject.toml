[project]
name = "streetfit"
version = "0.1.0"
description = "Reproducible, evidence-graded audits of whether a street fits the buses scheduled on it, from open municipal GIS, GTFS and design references."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "Diogo Adegas", email = "diogo.adegas@gmail.com" }]
keywords = ["civic-tech", "gtfs", "gis", "urban-planning", "public-transport", "open-data", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# AI-assisted tools: claim checking, OCR/vision extraction of standards, source discovery
agents = ["anthropic>=2.3", "pydantic>=2.7", "pypdf>=5.0", "pypdfium2>=4.30"]

[project.scripts]
streetfit = "streetfit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetfit"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E731", "SIM108"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs the case's cached sources (streetfit fetch)",
  "live: calls a paid or external API",
]
