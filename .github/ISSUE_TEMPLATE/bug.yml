name: Bug
description: Something is wrong in the code or in a result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Command, case, and the output or the result that looks wrong."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
  - type: input
    id: version
    attributes: {label: "streetfit version / commit, Python version, OS"}
