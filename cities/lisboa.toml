# City profile: Lisboa (Câmara Municipal de Lisboa open GIS services).
# Everything a Lisbon case shares. A case only adds its street, envelope and parameters.

[city]
id = "lisboa"
name = "Lisboa"
country = "PT"
crs = 3763  # ETRS89 / PT-TM06 (metres)

[cartography]
# 1:1000 municipal cartography, polygon layer. Class codes from the CML object catalogue
# (https://dados.cm-lisboa.pt/dataset/80d8abc8-9d7a-4b2e-a4b6-d683862a69e3, "Catálogo de objetos").
class_field = "LAYER"
road = ["10010306_RuaAvenidaRotundaPracaLargoPasseio", "10010307_Arruamentos"]
parking = ["10100104_ParqueEstacionamentoArea"]
sidewalk = ["87000501_Passeio"]
plot = ["06020103_Predio", "06020206_Logradouro", "06020201_Garagem", "06020203_ArrecadacaoAnexo",
        "06000000_ConstrucoesEmGeral", "06020102_VivendaCasa", "06020106_CorpoRecuado", "06020111_CorpoBalancado",
        "06020112_CorpoElevado", "06020202_TelheiroAlpendre"]
survey = "Aerial photogrammetry May 2016; restitution and field completion 2020; homologated by DGT (dados.gov.pt record)"
accuracy_note = "Planimetric accuracy assumed ≤0.30 m per edge (DGT figure for plan-scale cartography, as quoted in a 2025 DGT opinion); the 1:1000 RMSE itself was not found."

[axes]
name_field = "DESIGNACAO"

[network]
# Lisboa Interativa routing network "Sentidos de Trânsito" (map service 43, layer 203)
edge = "[EID]"
direction = "[Direction]"
status = "Oneway"
open_value = "Traversable"

[source_templates.cml_cartography_polygons]
kind = "arcgis_query"
url = "https://gisbase.cm-lisboa.pt/arcgis/rest/services/MapaBase_WGS84/MapServer/53"
envelope_sr = 4326
out_sr = 3763
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
licence_evidence = "https://dados.gov.pt/datasets/cartografia-numerica-vetorial (licence id cc-by, defined by dados.gov.pt as CC BY 4.0; checked 2026-10-24)"
dataset_page = "https://dados.gov.pt/datasets/cartografia-numerica-vetorial"
attribution = "© Câmara Municipal de Lisboa"
redistributable = true

[source_templates.cml_street_axes]
kind = "arcgis_query"
url = "https://gisbase.cm-lisboa.pt/arcgis/rest/services/MapaBase_WGS84/MapServer/79"
envelope_sr = 4326
out_sr = 3763
licence = "not stated by the service (CML MapaBase; the open 'Rede Viária' dataset is CC0, identity with this layer not verified)"
attribution = "© Câmara Municipal de Lisboa"

[source_templates.lxi_network_identify]
kind = "arcgis_identify"
url = "https://websig.cm-lisboa.pt/MuniSIG/REST/sites/BCK_LisboaInterativa_22Set26/map/mapservices/43/rest/services/x/MapServer/identify"
layers = "all:203"
sr = 3763
tolerance = 3
licence = "not stated (Lisboa Interativa public viewer, guest access)"
note = "The site name embeds a backup date (22Set26) and may be renamed; list current sites at https://websig.cm-lisboa.pt/MuniSIG/REST/sites"

[source_templates.carris_gtfs]
kind = "http_file"
attribution = "Carris (GTFS)"
url = "https://gateway.carris.pt/gateway/gtfs/api/v2.11/GTFS"
suffix = ".zip"
licence = "not stated at the download endpoint (not redistributed)"
note = "Always serves the current feed; a case pins the feed it used with sha256."

[source_templates.cml_na_minha_rua]
kind = "http_files"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
licence_evidence = "https://dados.gov.pt/datasets/ocorrencias-na-minha-rua-lx (licence id cc-by, defined by dados.gov.pt as CC BY 4.0; checked 2026-10-24)"
dataset_page = "https://dados.gov.pt/datasets/ocorrencias-na-minha-rua-lx"
attribution = "© Câmara Municipal de Lisboa"
redistributable = true
columns = { lat = "latitude", lon = "longitude", date = "dt_registo", category = "tipologia" }

# --- What every Lisbon case shares ----------------------------------------------------------------------
# Method parameters, the vehicles and the design references compared. A case can override any of them. The data
# pinned at a date (the GTFS feed and its service day, the Na Minha Rua files) are in a dated file that extends this
# one, e.g. lisboa-2026-10.toml, so a case keeps its inputs when newer data come out.

[profiles]
step_m = 0.5
half_width_m = 25
narrow_max_m = 7.0
# parking_space_m (the length of one longitudinal space, to count places) is left at the default range in
# config.py, an assumption: set Lisbon's own bay length here once a municipal source states it (the public-space
# manual, parking regulations or EMEL's bay specification).

[direction]
source = "network_identify"

[transit]
source = "carris_gtfs"
speeds_kmh = [15, 20]            # assumed; scheduled_runtimes.csv gives the speeds the schedule implies, and the
                                 # ledger also reports the encounters at the slowest of them
buffer_m = 12

[envelope]
bus = "carris_man_city_gold"
car = "car_typical"
scenarios = [
  ["carris_man_city_gold"],
  ["carris_man_city_gold", "car_typical"],
  ["carris_man_city_gold", "carris_man_city_gold"],
  ["car_typical", "car_typical"],
]

[occurrences]
source = "na_minha_rua"
window_m = 300
max_dist_m = 12
min_street_length_m = 100
filters = { abusive_parking = "^Estacionamento abusivo" }

[area_scan]
step_m = 3
threshold_m = 5.5
reference_m = 6.5
min_pattern_m = 30
identify_source = "area_network_identify"

[standards]
compare = ["cml_manual_two_way_profile", "rast06_bus_bus"]

# A case gives the envelopes of the four ArcGIS sources (around its street, and around its area).
[sources.cartography]
template = "cml_cartography_polygons"

[sources.street_axes]
template = "cml_street_axes"

[sources.network_identify]
template = "lxi_network_identify"
tolerance = 6

[sources.carris_gtfs]
template = "carris_gtfs"

[sources.na_minha_rua]
template = "cml_na_minha_rua"

[sources.area_cartography]
template = "cml_cartography_polygons"
where = "LAYER IN ('10010306_RuaAvenidaRotundaPracaLargoPasseio','10010307_Arruamentos','10100104_ParqueEstacionamentoArea')"

[sources.area_axes]
template = "cml_street_axes"

[sources.area_network_identify]
template = "lxi_network_identify"
tolerance = 3

# Listed after a case's own gaps.
[[known_gaps]]
pt = "A Carris não publica atrasos nem incidentes por rua."
en = "Carris does not publish delays or incidents per street."

[[known_gaps]]
pt = "A largura dos autocarros com espelhos não foi encontrada em ficha oficial (2,90 m é pressuposto)."
en = "No official mirror width was found for the buses (2.90 m is an assumption)."

[[known_gaps]]
pt = "A posição real dos carros estacionados (sobressaída das faixas) não foi medida no local."
en = "The actual position of parked cars (overhang beyond the strips) was not measured on site."
