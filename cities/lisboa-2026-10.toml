# Lisbon data as of October 2026: the GTFS feed and the Na Minha Rua files a case uses, and the service day it
# counts buses on. When newer data come out, add a file like this one (e.g. lisboa-2027-04.toml) and point new
# cases at it; a case that already has results keeps the file it was run with, so its results stay reproducible.

extends = "lisboa.toml"

[transit]
service_date = 2026-10-27        # a Tuesday within the feed's validity

[sources.carris_gtfs]
# The Carris endpoint only serves the current feed; the pinned feed is archived byte-for-byte by the
# Mobility Database, and the case downloads it from there.
url = "https://files.mobilitydatabase.org/mdb-2929/mdb-2929-202610200105/mdb-2929-202610200105.zip"
sha256 = "c7550ea2d2f039d127d9d3dbbcb28687b2d1f958f36999d79fe30c2f76d1c1d7"
description = "Carris GTFS as published on 2026-10-19 (origin: https://gateway.carris.pt/gateway/gtfs/api/v2.11/GTFS)"

[sources.na_minha_rua]
files = [
