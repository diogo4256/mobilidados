[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Numa faixa de rodagem estreitada por obras ou obstáculos ocasionais, salvo se houver circulação alternada, a largura deixada à circulação não pode ser inferior a 5,8 m onde circulem automóveis pesados. A regra é para obras e obstáculos, não para estacionamento; mas mostra a largura que o próprio Regulamento considera necessária para pesados nos dois sentidos, e a largura livre medida, 4,90 m, fica abaixo dela."
source = "Regulamento de Sinalização do Trânsito (Decreto Regulamentar n.º 22-A/98), art. 87.º, n.º 4"

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Compete à Câmara Municipal deliberar sobre o estacionamento de veículos nas vias públicas."
source = "Lei n.º 75/2013, anexo I, art. 33.º, n.º 1, alínea rr)"

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Uma proibição de estacionar sinaliza-se com o sinal C15; uma proibição por horas e dias, com um painel adicional do modelo n.º 7d (dias da semana e horas do dia)."
source = "Regulamento de Sinalização do Trânsito (Decreto Regulamentar n.º 22-A/98), sinais de proibição e painéis adicionais"

[[appraisal.notes]]
dimension = "operational"
grade = "D"
text = "A Carris registou 1 284 interrupções por estacionamento indevido em 2025 (1 365 em 2024), com 824 horas de impacto, em 229 arruamentos; a velocidade média de exploração desceu, e a Carris diz trabalhar com a Câmara em medidas na rede viária para cumprir horários."
source = "Carris, Relatório e Contas 2025, p. 29–30; Relatório e Contas 2024, p. 26–27"

[[appraisal.notes]]
dimension = "social"
grade = "D"
text = "O plano da EMEL para 2026-2029 prevê 11 parques novos (3 115 lugares), nenhum em Alvalade; a Junta de Freguesia pede um parque subterrâneo junto à Av. da Igreja para os moradores."
source = "EMEL, Plano de Atividades e Orçamento 2026-2029, quadro 3-1; Junta de Freguesia de Alvalade, Plano de Atividades 2022"

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "A ocupação do estacionamento nas ruas vizinhas não foi encontrada: não se sabe se os carros deslocados têm lugar perto."

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "O atraso medido vem de um arquivo de terceiros que, em 2026, guardou uma cópia do feed a cada 8 a 45 minutos, em vez de 3 a 4 em 2025: o valor de 2026 não informa. Os registos de passagem pedidos à Carris (Lei n.º 26/2016) e os dados da PGIL pedidos à Câmara mostrariam o atraso atual."

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "O tempo fora da ponta, os carros retidos, a fiabilidade, as ligações ao comboio, os novos passageiros e os danos só entram na camada alargada, com valores pressupostos até serem medidos; a segurança, o acesso de emergência e a qualidade de vida ficam nos critérios sem preço."

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Sentido único para o trânsito geral, mantendo os autocarros nos dois sentidos: exige uma via BUS em contrassentido que não cabe em 4,90 m com estacionamento dos dois lados, e mudaria o trânsito das ruas vizinhas; fica fora deste estudo, que não tem modelo de tráfego."

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "O Código da Estrada obriga quem conduz a manter «distância lateral suficiente para evitar acidentes» dos veículos que transitam na mesma faixa, no mesmo sentido ou em sentido oposto (coima de 60 € a 300 €), e fixa 1,5 m para ultrapassar uma bicicleta. Com 4,90 m livres, um autocarro e um ligeiro que se cruzam ficam com 0,60 m entre eles e os carros estacionados, dos dois lados somados."
source = "Código da Estrada, art. 18.º, n.os 2 a 4; width_budget.csv, passing_practice.csv"

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "O regulamento de segurança contra incêndio em edifícios pede 6 m de largura útil nas vias de acesso a edifícios com mais de 9 m de altura e admite outras características, fundamentadas, em zonas edificadas cuja rede viária não possa ser corrigida. Aplica-se no licenciamento dos edifícios; para esta rua é uma referência, não uma regra que ela viole. Hoje há 4,90 m livres; com um lado livre, 6,91 m."
source = "Portaria n.º 1532/2008, republicada pela Portaria n.º 135/2020, art. 4.º, n.º 7, e art. 5.º, n.º 1, al. a)"

[[appraisal.notes]]
dimension = "operational"
grade = "D"
text = "A cartografia municipal mostra um quartel de bombeiros a cerca de 36 m da rua (a paragem no extremo sudoeste chama-se Bombeiros Alvalade). Um veículo de bombeiros (até 2,55 m) e um autocarro precisam de 6,25 m para se cruzarem com a margem dos guias de desenho; hoje há 4,90 m. Se os veículos de socorro usam a rua, o Regimento de Sapadores Bombeiros o dirá."
source = "Cartografia municipal 1:1000, camada QuartelDeBombeiros; passing_practice.csv"

[[appraisal.notes]]
dimension = "social"
grade = "D"
text = "Há escolas perto: uma escola básica e secundária a cerca de 90 m, uma creche a cerca de 100 m e escolas primárias a partir de cerca de 130 m. As saídas das escolas podem explicar parte do atraso concentrado entre as 17h e as 18h; e, numa rua mais larga junto a escolas, a velocidade dos automóveis tem de ser medida antes e durante o ensaio."
source = "Cartografia municipal 1:1000, camadas EscolaPrimaria, EscolaPreparatoriaEOuSecundaria, Creche e JardimDeInfancia; delay_by_hour.csv"

[[appraisal.notes]]
dimension = "evidence"
grade = "M"
text = "Na plataforma Na Minha Rua, a Rua Ricardo Jorge tem a maior densidade de queixas de estacionamento abusivo das 25 ruas da zona (2,9 por 100 m, de maio de 2017 a maio de 2026), mas são apenas 6: um sinal, não uma prova."
source = "occurrences_by_street.csv (Na Minha Rua, CML)"

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Desviar uma das carreiras: medido na rede de ruas em appraisal_reroutes.csv. Acaba com os encontros entre autocarros, mas não com os encontros com ligeiros e furgões; alonga o percurso e tira paragens a quem as usa. A decisão é de rede, da Carris, com as entradas e saídas por paragem."

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Mais fiscalização do estacionamento: os carros estão em lugares marcados, por isso fiscalizar não alarga a faixa livre."
