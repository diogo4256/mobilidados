extends = "../../cities/lisboa-2026-10.toml"

[case]
id = "lisboa-rua-ricardo-jorge"
title = "Rua Ricardo Jorge (Alvalade, Lisboa)"
language = "pt"
reference_run = "2026-10-20"
question = "A faixa livre entre as duas faixas de estacionamento deixa cruzar dois autocarros programados nos dois sentidos?"

[street]
name = "Rua Ricardo Jorge"
headings = { "+" = "SO→NE", "-" = "NE→SO" }   # s = 0 at Av. do Rio de Janeiro (SW), increasing to the NE
sides = { L = "NO", R = "SE" }                  # left / right of the direction of increasing s
blocks = [
  { id = "B1", start = 0.0, end = 87.42, label = "Av. do Rio de Janeiro → R. Cor. Marques Leitão" },
  { id = "B2", start = 87.42, end = 158.27, label = "R. Cor. Marques Leitão → R. Constantino Fernandes" },
  { id = "B3", start = 158.27, end = 209.25, label = "R. Constantino Fernandes → R. Carlos Mayer" },
]

[profiles]
check_points_s = [60.0, 122.0, 180.0]

[direction]
stations_s = [10, 30, 60, 80, 120, 150, 180, 200]

[transit]
routes = ["744", "46B"]
reference_stops = [
  { route = "744", direction_id = 0, stop_id = "11315", s_m = 33.6, heading = 1 },   # on the street
  { route = "744", direction_id = 1, stop_id = "11318", s_m = 202.5, heading = -1 },  # R. Reinaldo Ferreira, just past the NE end
  { route = "46B", direction_id = 0, stop_id = "11318", s_m = 202.5, heading = -1 },
]

[delay]
source = "carris_positions"
# The stretch between the two stops (11315 at s = 33.6 m, 11318 just past the NE end at s = 202.5 m), kept clear of
# both, so the time measured is time moving or held up, not time at a stop.
s_from = 45.0
s_to = 190.0

[sources.carris_positions]
template = "carris_positions_archive"
route_ids = ["200_0", "239_0"]   # 744 and 46B, as the GTFS feed names them
envelope = [-9.165, 38.737, -9.113, 38.777]   # about 2 km around the street: the stretch, its controls and the reach

[sources.cartography]
envelope = [-9.1425, 38.7555, -9.1355, 38.7590]

[sources.street_axes]
envelope = [-9.1425, 38.7555, -9.1355, 38.7590]

[sources.area_cartography]
envelope = [-9.1560, 38.7440, -9.1270, 38.7660]

[sources.area_axes]
envelope = [-9.1560, 38.7440, -9.1270, 38.7660]

# Listed before the gaps every Lisbon case shares (cities/lisboa.toml).
[[known_gaps]]
pt = "Não há observação de campo de dois autocarros a cruzar-se nesta rua: os encontros são estimativas do horário."
en = "No field observation of two buses meeting on this street: encounters are timetable estimates."

# Feasibility and cost-benefit appraisal of giving one parking strip back to the carriageway (docs/appraisal.md).
# Every value has a range, a grade and its source; the measured inputs (the peak excess, the share of it each option
# can remove, the buses at peak, the working days, the metres of parking) come from the run's own tables.
[appraisal]
price_year = 2025
horizon_years = 10
discount_rate = 0.05             # EAV 2021-2027, p. 20: 5 % for cohesion countries (Reg. 2015/207, annex III)
discount_rates_tested = [0.03, 0.07]
horizons_tested = [20]
seed = 20261118
# the off-peak delay and the peak delay come from the same encounters in the same narrow sections: they move together;
# where the streets nearby have no room at night, the car parks are likely to be fuller too
correlations = [{ a = "excess_s", b = "offpeak_s", rho = 0.5 }, { a = "room_nearby", b = "spare_capacity", rho = 0.5 }]
# the central off-peak excess: the peak excess scaled by how often buses meet off-peak relative to the peak, at the
# junction where they demonstrably meet (delay_copresence.csv); the range stays as below
offpeak_from_copresence = true
# the off-peak excess comes from working days; on Saturdays and Sundays fewer buses run, so they meet less often
offpeak_scales_with_service = true

