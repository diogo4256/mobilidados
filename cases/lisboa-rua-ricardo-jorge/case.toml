[[appraisal.criteria]]
id = "reliability"
dimension = "passengers"
label = "Fiabilidade da viagem de autocarro (o stress de não saber quando se chega)"
indicator = "Dispersão do tempo de passagem; impasses por semana"
effects = { B = "++", C = "+", E = "+", G = "+", H = "+" }
grade = "I"
note = "Sem o estacionamento de um lado, dois autocarros cruzam-se sem esperar (6,91 m livres; precisam de 5,80 m com espelhos): acabam os impasses e a espera no cruzamento com a R. Cor. Marques Leitão. B em toda a rua e a toda a hora; C só no troço mais longo; E, G e H só nas horas em que vigoram."
source = "without_parking.csv, width_budget.csv, delay_copresence.csv"

[[appraisal.criteria]]
id = "rail"
dimension = "network"
label = "Acesso ao comboio e ao metro"
indicator = "Ligações perdidas em Entrecampos, no Oriente e no Campo Grande"
effects = { B = "+", C = "+", E = "+", G = "+", H = "+" }
grade = "I"
note = "A 744 liga a rua à Estação de Entrecampos (cerca de 12 min) e à Gare do Oriente (cerca de 14 min); a 46B ao Campo Grande e a Entrecampos. Um comboio perdido custa o intervalo até ao seguinte; a camada alargada conta o atraso de quem muda como atraso imprevisto, mas não a confiança de poder contar com a ligação."
source = "Horário GTFS da Carris (outubro de 2026)"

[[appraisal.criteria]]
id = "residents"
dimension = "residents"
label = "Qualidade de vida de quem estaciona na rua"
indicator = "Minutos a mais por dia a procurar lugar e a andar; lugares de cargas e de pessoas com mobilidade reduzida"
effects = { B = "--", C = "-", E = "-", G = "-", H = "-" }
grade = "I"
note = "Cerca de 21 lugares em B, E e G; 10 em C e H; nas opções por horas, só nessas horas. O custo em dinheiro está nas contas; aqui fica o resto: a incerteza de encontrar lugar, as cargas e descargas, quem tem mobilidade reduzida."
source = "appraisal_results.csv; cartografia municipal"

[[appraisal.criteria]]
id = "street"
dimension = "environment"
label = "Ruído e ar na rua"
indicator = "Arranques e esperas de autocarros com o motor ligado; carros a circular à procura de lugar"
effects = { B = "+", C = "+", E = "+", G = "+", H = "+" }
grade = "P"
note = "Menos esperas e arranques de autocarros numa rua estreita, com prédios dos dois lados; do outro lado, mais carros às voltas à procura de lugar se não houver lugares livres perto. A camada alargada conta os custos externos das viagens tiradas ao carro; o ruído na própria rua não tem medição."
source = "Handbook on the external costs of transport (2019), quadro 37"

[[appraisal.criteria]]
id = "safety"
dimension = "safety"
label = "Segurança"
indicator = "Toques e manobras de recuo; velocidade; visibilidade nos cruzamentos"
effects = { "*" = "?" }
grade = "P"
note = "Acabam os toques entre autocarros e carros estacionados e as manobras de recuo, e vê-se melhor quem atravessa; mas uma faixa mais larga convida a ir mais depressa (a camada alargada inclui medidas de acalmia). O efeito líquido só se sabe medindo a velocidade e os incidentes antes e depois."
source = "Registo de ocorrências pedido à Carris"

[[appraisal.criteria]]
id = "emergency"
dimension = "safety"
label = "Acesso de veículos de socorro"
indicator = "Veículos de socorro retidos na rua"
effects = { B = "+", C = "+", E = "+", G = "+", H = "+" }
grade = "NE"
note = "Uma ambulância ou um pronto-socorro também não cruza um autocarro em 4,90 m. A paragem seguinte chama-se Bombeiros Alvalade, mas não se verificou se os veículos do Regimento de Sapadores Bombeiros ou do INEM usam a rua."
source = ""

[[appraisal.criteria]]
id = "design"
dimension = "policy"
label = "Referência municipal de desenho de rua"
indicator = "Largura livre face ao perfil do manual (6,80 m entre faixas de estacionamento)"
effects = { B = "++", C = "+", E = "+", G = "+", H = "+" }
grade = "D"
note = "Com estacionamento só de um lado, a largura livre passa a 6,91 m, acima dos 6,80 m do manual: em toda a rua em B, só no troço mais longo em C, e só nas horas em que vigoram em E, G e H."
source = "Lisboa: o Desenho da Rua – Manual de espaço público, p. 152; standards_comparison.csv"

[[appraisal.criteria]]
id = "equity"
dimension = "equity"
label = "Quem ganha e quem perde"
indicator = "Viagens de passageiros por ano face a lugares retirados"
effects = { "*" = "?" }
grade = "I"
note = "Os ganhos repartem-se por cerca de meio milhão de viagens de passageiros por ano, muitas de quem não tem carro; a perda concentra-se em cerca de 21 lugares. Quanto pesa cada grupo é uma escolha da Câmara: o quadro de quem ganha e quem perde dá os números."
source = "appraisal_distribution.csv"

[[appraisal.criteria]]
id = "reversible"
dimension = "policy"
label = "Reversibilidade"
indicator = "Custo e tempo de desfazer"
effects = { "*" = "+" }
grade = "I"
note = "Sinais e tinta: qualquer opção se desfaz em dias e por pouco dinheiro."
source = ""

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Numa faixa de rodagem estreitada por obras ou obstáculos ocasionais, salvo se houver circulação alternada, a largura deixada à circulação não pode ser inferior a 5,8 m onde circulem automóveis pesados. A regra é para obras e obstáculos, não para estacionamento; mas mostra a largura que o próprio Regulamento considera necessária para pesados nos dois sentidos, e a largura livre medida, 4,90 m, fica abaixo dela."
source = "Regulamento de Sinalização do Trânsito (Decreto Regulamentar n.º 22-A/98), art. 87.º, n.º 4"

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Compete à Câmara Municipal deliberar sobre o estacionamento de veículos nas vias públicas."
source = "Lei n.º 75/2013, anexo I, art. 33.º, n.º 1, alínea rr)"

[[appraisal.notes]]
dimension = "legal"
grade = "D"
text = "Uma proibição de estacionar sinaliza-se com o sinal C15; uma proibição por horas e dias, com um painel adicional do modelo n.º 7d (dias da semana e horas do dia)."
source = "Regulamento de Sinalização do Trânsito (Decreto Regulamentar n.º 22-A/98), sinais de proibição e painéis adicionais"

[[appraisal.notes]]
dimension = "operational"
grade = "D"
text = "A Carris registou 1 284 interrupções por estacionamento indevido em 2025 (1 365 em 2024), com 824 horas de impacto, em 229 arruamentos; a velocidade média de exploração desceu, e a Carris diz trabalhar com a Câmara em medidas na rede viária para cumprir horários."
source = "Carris, Relatório e Contas 2025, p. 29–30; Relatório e Contas 2024, p. 26–27"

[[appraisal.notes]]
dimension = "social"
grade = "D"
text = "O plano da EMEL para 2026-2029 prevê 11 parques novos (3 115 lugares), nenhum em Alvalade; a Junta de Freguesia pede um parque subterrâneo junto à Av. da Igreja para os moradores."
source = "EMEL, Plano de Atividades e Orçamento 2026-2029, quadro 3-1; Junta de Freguesia de Alvalade, Plano de Atividades 2022"

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "A ocupação do estacionamento nas ruas vizinhas não foi encontrada: não se sabe se os carros deslocados têm lugar perto."

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "O atraso medido vem de um arquivo de terceiros que, em 2026, guardou uma cópia do feed a cada 8 a 45 minutos, em vez de 3 a 4 em 2025: o valor de 2026 não informa. Os registos de passagem pedidos à Carris (Lei n.º 26/2016) e os dados da PGIL pedidos à Câmara mostrariam o atraso atual."

[[appraisal.notes]]
dimension = "evidence"
grade = "NE"
text = "O tempo fora da ponta, os carros retidos, a fiabilidade, as ligações ao comboio, os novos passageiros e os danos só entram na camada alargada, com valores pressupostos até serem medidos; a segurança, o acesso de emergência e a qualidade de vida ficam nos critérios sem preço."

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Sentido único para o trânsito geral, mantendo os autocarros nos dois sentidos: exige uma via BUS em contrassentido que não cabe em 4,90 m com estacionamento dos dois lados, e mudaria o trânsito das ruas vizinhas; fica fora deste estudo, que não tem modelo de tráfego."

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Desviar uma das carreiras: passa o problema para outra rua e tira paragens a quem as usa; é uma decisão de rede da Carris, fora deste estudo."

[[appraisal.notes]]
dimension = "options"
grade = "P"
text = "Mais fiscalização do estacionamento: os carros estão em lugares marcados, por isso fiscalizar não alarga a faixa livre."
