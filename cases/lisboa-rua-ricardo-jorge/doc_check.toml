         "{appraisal_results.csv:npv[layer=core,option=B]}", "{appraisal_results.csv:npv[layer=extended,option=B]}"]
pt = '^\| \*\*VAL\*\* \| \*\*([−\d,]+)\*\* \| \*\*([−\d,]+)\*\* \| \*\*([−\d,]+)\*\* \| \*\*([−\d,]+)\*\* \|'
en = '^\| \*\*NPV\*\* \| \*\*([−\d.]+)\*\* \| \*\*([−\d.]+)\*\* \| \*\*([−\d.]+)\*\* \| \*\*([−\d.]+)\*\* \|'

