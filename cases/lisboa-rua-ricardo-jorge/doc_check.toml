# What the decision paper (pt) and the economic appraisal (en) say, pinned to the model outputs they quote.
# `mobilidados check-doc cases/lisboa-rua-ricardo-jorge <exported.md> --lang pt|en [--other <other language>.md]`
# fails when a pinned statement prints a number the model no longer gives, or when it cannot be found any more.
# A pattern's groups capture printed numbers; `value` gives one expression per group: arithmetic on cells
# {table.csv:column[key=value,...]}. Thousands of euros and percentages are matched at their scale.

ignore_values = [46.30, 19.40, 5.34, 365, 1365, 1284, 145, 2016, 11307]
ignore_patterns = ["art\\.", "n\\.º", "n\\.os", "Lei n", "Portaria", "Decreto", "\\b(19|20)\\d\\d\\b", "paragens? \\d", "stops? \\d",
  "\\b744\\b", "46B", "secção \\d", "section \\d", "chapter \\d", "anexo", "Figura \\d", "Figure \\d", "quadro \\d", "table \\d",
  "B\\.2\\.2", "7\\.1\\.2", "p\\. 152"]

# ---------------------------------------------------------------- headline accounts (summary and section 4 / chapter 5)

[[claims]]
