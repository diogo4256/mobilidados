# Vehicle catalogue. Every width carries an evidence grade (docs/evidence-standard.md) and its source.
# Add vehicles here (shared) or in a case's [vehicles.<id>] table (case-specific).

[vehicles.bus_eu_max]
label = "Bus at the EU/PT legal maximum width"
category = "bus"
width_body_m = 2.55
grade_body = "D"
source_body = "Directive 96/53/EC Annex I 1.2; PT: Decreto-Lei 132/2017, art. 3.º n.º 3 a)"
width_mirrors_m = 2.95
grade_mirrors = "P"
source_mirrors = "Assumption: +0.40 m for mirrors, as in the Mercedes-Benz eCitaro technical sheet"
mirrors_clear_cars = true

