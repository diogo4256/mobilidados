# Design references for carriageway width. Each entry is a *reference* with an explicit scope, never a
# universal rule: before comparing a street against an entry, check that the street falls within `scope`.
#
#   kind = "reference_profile"  a recommended cross-section in a design manual (not binding)
#   kind = "conditional_value"  a value the document allows only under the stated conditions
#   kind = "secondary_citation" an official document quoting a standard we have not read ourselves
#
# `document_sha256` lets anyone check they are reading the same file. `page` is the printed page number;
# `pdf_page` is the 1-based page index in the PDF. Quotes are in the PDF text layer unless quote_location = "image".
# Text in other languages goes in a [references.translations.<lang>] table after the entry.

