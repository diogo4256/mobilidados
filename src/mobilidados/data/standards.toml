kind = "reference_profile"
value_m = 6.80
also_m = 6.50
label = "Two-way street, two traffic lanes, longitudinal parking both sides: width between the parking strips"
derivation = "0.40 m (extra width) + 3.00 m + 3.00 m + 0.40 m (extra width) = 6.80 m; note to the drawing: without the extra width the recommended lane width is 3.25 m, i.e. 6.50 m"
scope = "Two-way streets with two traffic lanes and parking on both sides"
quote_location = "image"  # printed under the drawing, absent from the PDF text layer
quote = "Na inexistência de sobrelargura a largura recomendada para as vias é de 3.25 metros (salvo casos particulares)."
extraction = "Values read from the cross-section drawing (raster image, not in the PDF text layer); the note is printed under the drawing. Verified by eye on 2026-10-24."

