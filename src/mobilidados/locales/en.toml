h_limits = "Limits of the method"
limit_1 = "The measured delay comes from a third-party archive, mostly from 2025; today's can only be shown by Carris's data or the municipality's (PGIL)."
limit_2 = "The extended layer rests on assumed values: the table from the core to the extended layer shows how much each weighs, and the value of information says which can change the decision most."
limit_3 = "Time lost off-peak is assumed to be lost at the same places along the street as at peak; Carris's passage records confirm it or not."
limit_4 = "There is no traffic model: whether a wider street attracts through traffic, and the effect on neighbouring streets, are not estimated."
limit_5 = "The values of time come from European values adjusted to Portugal's labour cost, not from a survey in Lisbon; the value of a place comes from EMEL's prices, not from a survey of those who park."
limit_6 = "The inputs vary independently in the simulation; those that move together (more passengers when buses are fuller and slower) would widen the interval."
limit_7 = "The effects without a price are not in the NPV; the decision must weigh them beside it."
h_scenarios = "Scenarios"
scenarios_intro = "Each option's NPV in named scenarios. Cautious: every input the measurement does not cover yet at the end of its range least favourable to the option, all at once; favourable: at the opposite end. It is a bound, not a probability: the simulation says how likely each result is."
