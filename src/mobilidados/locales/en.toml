problem = "Along the stretches with parking on both sides ({metres} m), the median free width is {free} m; two buses side by side need at least {bb} m, bodies only ({bbm} m with mirrors). Without the parking on one side, the median would be {one_side} m. On working days at {peak}, the difference between the time buses spent on the stretch between stops and what the neighbouring stretches would explain was {pct}% (90% interval: {lo}% to {hi}%), about {s} s per passage ({slo} to {shi} s), from GPS positions archived by a third party (by year: {years})."
problem_parts = "That excess is not only in the narrow sections: {narrow} s are inside them and {gaps} s at the junctions between them. At the junction {giving}, buses have a bus in the other direction on the street {share}% of the time, against {chance}% by chance (p {p}, resampling whole days): that is where buses lose time when another is coming the other way. Positions recorded minutes apart cannot show what they do there (wait, stand face to face, reverse); but a 12 m bus cannot step aside in a junction this short to let another by. The central value therefore counts as removable the excess of the narrow sections and of that junction ({attr}% of the total)."
problem_parts_none = "That excess splits along the stretch as follows: {narrow} s inside the narrow sections and {gaps} s between them; at no junction do buses have an oncoming bus on the street more often than chance explains. The central value counts as removable only the excess of the narrow sections ({attr}% of the total)."
