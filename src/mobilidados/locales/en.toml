standard = "It follows the European Commission's method for Portugal (EAV 2021-2027: the discount rate, the values of time and their real growth with income, the weights of delay, proportionality) and, where the EAV is silent, the practice of the UK Department for Transport (TAG and the Value for Money Framework, 2025): two benefit-cost ratios, a table of what has no price, who gains and who loses, and switching values. The appraisal is proportionate to what is at stake (signs and paint in one street): there is no traffic model, and what is not measured is said."
h_vfm = "Value for money"
vfm_intro = "Two conventions for the same account. The EAV divides all the benefits by all the costs, with the value of the places lost among the costs. The DfT counts the places lost as a disbenefit to those who use them, netted from the benefits, and divides by what the public budget pays (works, enforcement); its categories are: very high from 4, high from 2 to 4, medium from 1.5 to 2, low from 1 to 1.5, poor from 0 to 1, very poor below 0. The NPV is the same in both: it is what decides. The DfT's ratio rises steeply when the works are cheap, so it is not read alone; and the DfT itself adjusts the category for what has no price."
vfm_header = "| layer | option | NPV | benefit/cost (EAV) | benefit/cost to the budget (DfT) | category (DfT) |"
