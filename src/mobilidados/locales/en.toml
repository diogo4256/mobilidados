layers_intro = "The accounts come in two layers. The **core** counts only what the data measure or official documents state: the time buses lose at the evening peak, the value of the places removed to whoever loses them, the works and the enforcement. The **extended layer** adds what the measurement cannot see yet, each mechanism with a unit value from a published source and a range: the time lost off-peak and at weekends; reliability (an unexpected delay weighs more than a usual one, and for those who change to a train or the metro it can cost the connection); the cars held behind the buses; the new passengers a faster, surer bus attracts, and the external costs of the car trips they leave (congestion, accidents, noise, pollution, climate); damage from scrapes. On the cost side: those who find a place nearby lose only a walk, and traffic calming may be needed. The stress of driving the new passengers leave behind is already in the gain that makes them change (the rule of a half): it is not counted twice. The rest (quality of life, the street's noise and air, safety, emergency access) is in the criteria without a price, below."
