ref = "(lista anexa: `{id}`)"
request = "Pedido"
ask_buses_review = "Peço que os serviços competentes confirmem estes valores, nomeadamente nos pontos indicados em anexo, e avaliem a revisão do perfil da {street} de modo a que os autocarros que ali circulam se possam cruzar, informando-me da decisão tomada."
ask_buses_documents = "Ao abrigo da Lei n.º 26/2016, de 22 de agosto (artigos 12.º e 15.º), peço cópia, em formato digital, dos seguintes documentos sobre a {street}: [o projeto ou a deliberação que definiu o estacionamento dos dois lados da rua]; [estudos, contagens ou registos dos serviços sobre a circulação dos autocarros na rua]. O artigo 15.º da mesma lei prevê a resposta no prazo de 10 dias."
ask_sidewalks_review = "Peço que os serviços competentes confirmem a largura livre dos passeios da {street} nos troços indicados em anexo e, onde fique abaixo de 1,2 m, me informem das medidas e do prazo previstos para a corrigir, nos termos do Decreto-Lei n.º 163/2006, de 8 de agosto."
ask_sidewalks_documents = "Ao abrigo da Lei n.º 26/2016, de 22 de agosto (artigos 12.º e 15.º), peço cópia, em formato digital, dos seguintes documentos sobre os passeios da {street}: [o plano ou o levantamento de acessibilidade que os abranja]; [a fundamentação de qualquer exceção aplicada a estes passeios ao abrigo do artigo 10.º do Decreto-Lei n.º 163/2006]. O artigo 15.º da mesma lei prevê a resposta no prazo de 10 dias."
attachments = "Anexos"
