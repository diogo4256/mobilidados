# - [transit] as carreiras que percorrem a rua no dia de serviço e, para cada carreira e sentido, a paragem junto
#   à rua servida pela maioria das viagens. Paragens escolhidas (distância ao eixo; s, posição ao longo da rua):"""
header_stop = "#     carreira {route} no sentido {heading} (direction_id {direction_id}): paragem {stop_id} ({name}), a {dist} m do eixo, s = {s} m;"
