standard = "Segue-se o método da Comissão Europeia para Portugal (EAV 2021-2027: taxa de desconto, valores do tempo e o seu crescimento real com o rendimento, pesos do atraso, proporcionalidade) e, onde o EAV é omisso, a prática do Department for Transport britânico (TAG e Value for Money Framework, 2025): duas razões benefício/custo, um quadro do que não tem preço, quem ganha e quem perde, e valores de inversão. A avaliação é proporcional ao que está em causa (sinais e tinta numa rua): não há modelo de tráfego, e o que não se mede fica dito."
h_vfm = "Valor pelo dinheiro"
vfm_intro = "Duas convenções para a mesma conta. O EAV divide todos os benefícios por todos os custos, com o valor dos lugares perdidos nos custos. O DfT conta os lugares perdidos como um prejuízo de quem os usa, abatido aos benefícios, e divide pelo que paga o orçamento público (obra, fiscalização); as suas categorias são: muito alto a partir de 4, alto de 2 a 4, médio de 1,5 a 2, baixo de 1 a 1,5, fraco de 0 a 1, muito fraco abaixo de 0. O VAL é o mesmo nas duas: é ele que decide. A razão do DfT sobe muito quando a obra é barata, por isso não se lê sozinha; e o próprio DfT diz que a categoria se ajusta pelo que não tem preço."
