delay_cause = "Mede onde se perde o tempo, não porquê: o estacionamento, os autocarros em sentido contrário, uma fila vinda de um cruzamento ou um semáforo podem todos contribuir."
delay_directions = "Por carreira e sentido: {list}."
delay_direction = "{route} {heading} {pct}% ({lo}% a {hi}%)"
delay_sensitivity = "Com outras escolhas razoáveis (horas de ponta, distância e comprimento dos troços de controlo, idade máxima das posições, alcance da contagem de passagens), o rácio vai de {lo}% a {hi}% (delay_sensitivity.csv)."
delay_by_hour = "O excesso em segundos depende muito da hora de ponta escolhida: {list} (delay_sensitivity.csv); o rácio muda pouco."
delay_hour = "só às {h}h, {s} s"
delay_passages = "As passagens contadas são {pct}% das do horário de {day} nas mesmas horas; se faltarem passagens, os segundos estão sobrestimados na mesma proporção (o rácio não depende delas)."
delay_days = "Dias úteis: de segunda a sexta, sem os feriados do perfil da cidade ({n} nesse período)."
occurrences = "Uma ocorrência não é uma infração provada e as contagens são pequenas. A ordenação divide as ocorrências contadas dentro da janela de atribuição (um retângulo que vai {w} m além da rua) pelo comprimento total de cada rua, incluindo a parte fora da janela: isso favorece as ruas que cabem inteiras na janela, como a deste caso."
