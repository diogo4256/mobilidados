# Como cada afirmação do registo foi obtida.
[method]
appraisal = "Análise custo-benefício incremental face a não fazer nada (Comissão Europeia, Economic Appraisal Vademecum 2021-2027), preços constantes de {year}; entradas, graus e fontes em appraisal_inputs.csv; o estudo completo está em appraisal.md."
length = "Comprimento do eixo da rua, em coordenadas projetadas."
traffic = "Consulta à rede viária municipal em pontos ao longo do eixo."
free_width = "Perfis transversais a cada {step} m; as larguras são lidas só nos polígonos cartografados."
parking_strips = "Área cartografada, não carros estacionados."
transit = "Viagens contadas numa paragem de referência em cada sentido; é o horário, não a operação observada."
runtimes = "Chegada à paragem seguinte menos partida da paragem de referência; distância em linha reta entre as duas."
width_budget = "Soma das larguras dos veículos lado a lado (envelope estático), sem simular a trajetória nem as curvas."
without_parking = "Largura livre mais a faixa (ou as faixas) de estacionamento cartografada no mesmo perfil, em cada perfil com estacionamento dos dois lados."
parking_removed = "Comprimento dos troços com estacionamento dos dois lados (o mesmo da largura livre), por cada lado retirado, a dividir pelo comprimento mais longo e pelo mais curto de um lugar; os comprimentos em toda a rua vêm de parking_strip_lengths.csv."
encounters = "Sobreposição dos intervalos em que cada autocarro está na rua, a velocidade constante e com as horas do horário; é o horário, não uma observação."
delay = "Ocupação (lei de Little): posições GPS no troço e em dois troços de controlo de {cm} m, a {gap} m antes e depois dele ao longo de cada carreira; o rácio entre a ponta e fora da ponta não depende do número de autocarros nem da frequência dos registos. Intervalos de confiança por reamostragem de dias inteiros ({reps} réplicas)."
delay_seconds = "Segundos por passagem: posições no troço a dividir pelas passagens por segundo, contadas como viagens vistas a menos de {reach} m do troço, só nas horas em que os registos nunca distam mais de {gap} min."
occurrences = "Cada ocorrência georreferenciada dos dados abertos é atribuída ao eixo de rua mais próximo."
area_pattern = "Perfis a cada {step} m em todos os eixos de rua por onde passam autocarros, medidos com parâmetros próprios desta pesquisa (comprimento do perfil e tolerâncias), e não com os da rua do caso; o sentido de trânsito é lido na rede viária num só ponto por rua."

# Limites de cada afirmação do registo. Uma ressalva composta junta várias destas frases.
[caveat]
appraisal = "O núcleo conta só o tempo medido na ponta; a camada alargada junta mecanismos com valores pressupostos (grau P) até serem medidos; a segurança, o acesso de emergência e a qualidade de vida ficam fora das contas (critérios sem preço). Os pressupostos são testados nos seus intervalos (appraisal_switching.csv, appraisal_tornado.csv, appraisal_voi.csv)."
free_filter = { one = "Só contam os perfis com estacionamento cartografado dos dois lados e até {max} m de largura livre: {k} dos {n} perfis com estacionamento dos dois lados tem mais largura livre e ficou de fora.", other = "Só contam os perfis com estacionamento cartografado dos dois lados e até {max} m de largura livre: {k} dos {n} perfis com estacionamento dos dois lados têm mais largura livre e ficaram de fora." }
survey = "Cartografia: {survey}."
