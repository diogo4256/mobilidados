[letter]
comment = """<!--
Rascunho feito por `mobilidados draft` a partir da lista de factos apurados do caso. Antes de enviar:
- preencha o que está entre [parênteses retos] e retire o que não se aplica;
- cada facto vem da lista tal como está, com o seu identificador; se mudar um número ou uma frase, volte a
  confirmar com `mobilidados check-claims`;
- os pressupostos ficam declarados como tal: se os retirar, retire também as estimativas que deles dependem;
- envie pelos canais oficiais, guarde o número de registo e anote os prazos (docs/writing-to-public-bodies.md).
-->"""
sender = "[Nome]  \n[Morada]  \n[Contacto]"
recipient = "[Destinatário: entidade e serviço]  \n[Morada ou endereço do canal oficial]"
place_date = "[Local], [data]"
subject_label = "Assunto:"
subject_buses = "espaço para a circulação dos autocarros na {street}"
subject_sidewalks = "largura dos passeios na {street}"
salutation = "[Exmo(a). Senhor(a)],"
opening_buses = "Escrevo a propósito da {street}, por onde passam autocarros de carreira. Os números abaixo vêm de dados publicados (cartografia municipal, horário do operador e outros indicados em anexo) e podem ser refeitos por qualquer pessoa: a lista anexa diz, para cada um, a fonte, o método e as reservas."
opening_sidewalks = "Escrevo a propósito dos passeios da {street}. Os números abaixo vêm da cartografia municipal e podem ser refeitos por qualquer pessoa: a lista anexa diz, para cada um, a fonte, o método e as reservas."
measured = "Medido em dados oficiais"
documents = "Documentos oficiais"
estimates = "Estimativas a partir destes dados"
assumptions = "Pressupostos"
