header_question = "# - [case] a pergunta, escrita para autocarros nos dois sentidos ou num só, conforme o horário."
header_one_way = """
#   Aqui os autocarros só passam num sentido, e a pergunta parte do princípio de que cabe um ligeiro ao lado do
#   autocarro, ou seja, de que a rua tem dois sentidos ou duas vias. Se a rua tiver um só sentido e uma só via, a
#   pergunta não se aplica tal como está: reescreva-a depois de o `mobilidados run` mostrar o sentido do trânsito."""
