# - [street] os sentidos e os lados, que aqui pedem uma decisão sua: o eixo está orientado a {bearing}° do norte
#   da quadrícula, a só {gap}° do limite entre {point} e {other_point} ({boundary}°). O rascunho lê a rua como
#   {point} (sentidos {headings}, lados {sides}), mas lê-la como {other_point} (sentidos {other_headings}, lados
