limit_1 = "O atraso medido vem de um arquivo de terceiros, sobretudo de 2025; o de hoje só os dados da Carris ou da Câmara (PGIL) o mostram."
limit_2 = "A camada alargada assenta em valores pressupostos: o quadro «do núcleo à camada alargada» mostra quanto pesa cada um, e o valor da informação diz quais mais podem mudar a decisão."
limit_3 = "Admite-se que o tempo se perde fora da ponta nos mesmos sítios da rua que na ponta; os registos de passagem da Carris confirmam-no ou não."
limit_4 = "Não há modelo de tráfego: não se estima se a rua mais larga atrai trânsito de passagem, nem o efeito nas ruas vizinhas."
limit_5 = "Os valores do tempo vêm de valores europeus ajustados ao custo da mão de obra em Portugal, não de um inquérito em Lisboa; o valor de um lugar vem dos preços da EMEL, não de um inquérito a quem estaciona."
limit_6 = "As entradas variam de forma independente na simulação; as que andam juntas (mais passageiros quando os autocarros vão mais cheios e mais lentos) alargariam o intervalo."
limit_7 = "Os efeitos sem preço não entram no VAL; a decisão deve pesá-los ao lado dele."
