[report]
intro = "Generated by `streetfit run` from the tables in `tables/`. Every statement carries an evidence grade: **M** measured from official data · **D** official document text · **I** inference · **P** assumption · **NE** not found / not verified (≠ does not exist)."
sources = "Sources"
origin = "origin"
retrieved = "retrieved"
licence = "licence"
files = "{n} files, e.g. {example}"
attribution = "Attribution"
transformed = "The data were transformed: tables and figures are measurements, counts and aggregations derived by streetfit; they are not publications of the originating body, which does not endorse them."
and = " and "
