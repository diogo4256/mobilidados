# streetfit messages, English. Every key must exist in every language (tests/test_config.py checks keys and {placeholders}).

[figure]
free_width = "Free width between parking strips"
width_m = "width (m), to scale"
limit = "limit"
mirrors = "mirrors"
does_not_fit = "does not fit"
margin = "margin"
with_mirrors = "with mirrors"
trips_per_hour = "trips per hour"
hour = "hour of day"
weekday_trips = "Scheduled trips on the street, weekday {day}"
along = "distance along the street (m)"
strips = "Mapped parking strips (left / right)"
profile_title = "Mapped cross-section along the street"
area_title = "Streets with buses in the area: free width vs. buses per day"
buses_day = "buses per weekday"
median_free = "median free width (m)"
parking_both = "parking on both sides"
free_width_short = "Free width"
data_credit = "Data: {sources}; adapted. Analysis: streetfit."
bus = "bus"
car = "car"
pattern_two_way = "two-way, parking both sides, narrow"
pattern_one_way = "one-way, parking both sides, narrow"

[ledger]
length = "The street axis is {length} m long."
traffic = "The municipal routing network marks the street as {traffic} (edges checked at {n} points along it)."
free = "Where parking strips are mapped on both sides ({metres} m of the street), the mapped free width between them is {fmin}–{fmax} m (median {fmed} m)."
strips = "The mapped parking strips are {sl} m ({side_l}) and {sr} m ({side_r}) wide (medians)."
routes = "Routes {routes} are scheduled along the street. On {day}: {n_up} trips {up} and {n_down} trips {down} (at most {max_up} and {max_down} per hour)."
vehicle_body = "Reference vehicle '{label}': body width {w} m ({src})."
vehicle_mirrors = "Width with mirrors of '{label}' taken as {w} m ({src})."
budget = "With both strips occupied and parked vehicles inside them, two buses need {bb} m (bodies only; {bbm} m with mirrors) against a median free width of {fmed} m: margin {mbb} m. A bus and a car need {bc} m: margin {mbc} m ({mbcm} m with the car's mirrors)."
encounters = "The timetable implies {nrange} meetings per weekday between buses in opposite directions on the street (constant-speed model at {speeds} km/h); {nnarrow} fall within the sections with parking on both sides."
encounters_check = "At {kmh} km/h, the slowest speed implied by the {day} schedule between stops (a lower bound), the model gives {per_day}."
runtimes = "Scheduled time from stop {a} to the next stop ({b}, {d} m in a straight line): median {m_all} s over all trips in the feed (at least {k_all} km/h) and {m_day} s on {day} (at least {k_day} km/h)."
occurrences = "{n} reports in category '{flt}' were attributed to the street ({period}, within {d} m of the axis): {rate} per 100 m, rank {rank} of {total} streets of at least {minlen} m in the surrounding area."
area = "Of {total} streets with scheduled buses in the surrounding area, {k} are two-way and combine parking on both sides with a free width below {thr} m over at least {minm} m ({names}); of these, {nb} with buses in both directions: {names2}."
standard = "{doc}, p. {page} ({kind}): {label}: {value} m. Scope: {scope}. Measured median: {fmed} m ({diff} m)."

[kind]
reference_profile = "reference profile"
conditional_value = "conditional value"
secondary_citation = "cited by an official document"

[traffic]
two-way = "two-way traffic"
one-way = "one-way traffic"
